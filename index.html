<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F5D45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pôle Éducation">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Pôle Éducation</title>
<style>
@font-face { font-family: 'Nunito'; font-weight: 400; font-display: swap; src: url('fonts/nunito-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'Nunito'; font-weight: 700; font-display: swap; src: url('fonts/nunito-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family: 'Nunito'; font-weight: 800; font-display: swap; src: url('fonts/nunito-latin-800-normal.woff2') format('woff2'); }
@font-face { font-family: 'Amiri'; font-weight: 400; font-display: swap; src: url('fonts/amiri-arabic-400-normal.woff2') format('woff2'); }

:root {
  --bg: #F6F3EC;
  --surface: #FFFDF8;
  --line: #E2DDD0;
  --line-soft: #ECE7DB;
  --green: #2F5D45;
  --green-mid: #3F7A58;
  --green-soft: #8DB59A;
  --tint: #E3EEE5;
  --text: #23302A;
  --muted: #56645B;
  --red: #C0392B;
  --red-text: #9B2C21;
  --red-bg: #FCEDEA;
  --red-line: #F0C9C3;
  --amber-bg: #FFF4D9;
  --amber-text: #7A5A10;
  --radius: 16px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-family: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--green); }
:focus-visible { outline: 3px solid #F2C94C; outline-offset: 2px; }
.ar { font-family: 'Amiri', 'Geeza Pro', 'Noto Naskh Arabic', 'Traditional Arabic', serif; }

#app { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
.page { flex: 1; padding: 20px 20px 32px; display: flex; flex-direction: column; gap: 12px; }

/* En-tête des pages internes */
.top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.back { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--green); text-decoration: none; flex-shrink: 0; }
.top-text { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.top-title { font-size: 22px; font-weight: 800; color: var(--green); }
.top-sub { font-size: 13px; color: var(--muted); }

/* Accueil */
.home-head { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0 4px; text-align: center; }
.logo-btn { width: 72px; height: 72px; border-radius: 50%; border: 1.5px dashed #6E9C7C; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--green); text-decoration: none; font-size: 10px; font-weight: 800; overflow: hidden; }
.logo-btn.has-logo { border: 1px solid var(--line); }
.logo-btn img { width: 100%; height: 100%; object-fit: cover; }
.home-name { font-size: 24px; font-weight: 800; color: var(--green); margin: 4px 0 0; }
.home-ar { font-size: 20px; color: var(--green-mid); }
.home-meta { font-size: 14px; color: var(--muted); }

.section-label { font-size: 13px; font-weight: 800; color: #4E6B58; margin-top: 8px; }

.big { display: flex; align-items: center; gap: 14px; min-height: 68px; padding: 10px 16px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); color: var(--text); text-decoration: none; }
.big.main { background: var(--green); border-color: var(--green); color: #fff; }
.big-icon { width: 38px; height: 38px; border-radius: 50%; background: var(--tint); color: var(--green); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.big.main .big-icon { background: #fff; }
.big-text { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.big-title { font-size: 18px; font-weight: 800; }
.big-sub { font-size: 13px; color: var(--muted); }
.big.main .big-sub { color: #DCEBE0; }
.badge-alert { height: 26px; min-width: 26px; padding: 0 9px; border-radius: 13px; background: var(--red); color: #fff; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; }

.group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 8px 16px; border: none; border-bottom: 1px solid var(--line-soft); background: transparent; color: var(--text); text-decoration: none; text-align: left; font-size: 16px; font-weight: 700; }
.row:last-child { border-bottom: none; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row-sub { font-size: 13px; font-weight: 400; color: var(--muted); }
.row-end { font-size: 13px; font-weight: 700; color: var(--muted); }
.row .ico { color: var(--green-mid); display: flex; }
.row.disabled { color: #8A948D; }
.row.disabled .ico { color: #A9B1AB; }
.switch { width: 50px; height: 30px; border-radius: 15px; padding: 3px; background: #CFC8B8; display: flex; flex-shrink: 0; }
.switch span { width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch.on { background: var(--green); justify-content: flex-end; }
.tag-soon { font-size: 12px; font-weight: 800; color: var(--muted); background: var(--line-soft); padding: 3px 8px; border-radius: 10px; white-space: nowrap; }

.foot { display: flex; gap: 10px; margin-top: auto; padding-top: 16px; }
.foot a { flex: 1; height: 48px; border-radius: 12px; border: 1px solid var(--line); color: var(--green); font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }

/* Boutons */
.btn { height: 50px; padding: 0 18px; border-radius: 14px; border: none; background: var(--green); color: #fff; font-size: 16px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn.light { background: var(--tint); color: var(--green); border: 1.5px solid var(--green); }
.btn.ghost { background: transparent; color: #3E4A43; border: 1px solid #CFC8B8; font-weight: 700; }
.btn.danger { background: var(--red); }
.btn.danger-soft { background: var(--red-bg); color: var(--red-text); border: 1px solid var(--red-line); }
.btn[disabled] { opacity: 0.5; cursor: default; }
.btn.full { width: 100%; }
.btn-row { display: flex; gap: 8px; }
.btn-row .btn { flex: 1; padding: 0 10px; white-space: nowrap; font-size: 15px; }

/* Champs */
.field { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: 14px; font-weight: 800; color: var(--green); }
.input, .select { height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; font-size: 16px; }
.search { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; color: var(--muted); }
.search input { flex: 1; border: none; outline: none; background: transparent; font-size: 16px; color: var(--text); min-width: 0; }
.hint { font-size: 13px; color: var(--muted); }
.error-text { font-size: 14px; font-weight: 700; color: var(--red-text); }

.banner { padding: 12px 14px; border-radius: 12px; font-size: 14px; font-weight: 700; line-height: 1.45; }
.banner.info { background: var(--tint); color: var(--green); }
.banner.warn { background: var(--amber-bg); color: #5C4510; }
.banner.err { background: var(--red-bg); color: var(--red-text); }

.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--tint); color: var(--green); font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }

.check { display: flex; align-items: center; gap: 12px; min-height: 48px; font-size: 16px; }
.check input { width: 22px; height: 22px; accent-color: var(--green); }

.logo-preview { width: 140px; height: 140px; border-radius: 24px; border: 2px dashed var(--green-soft); background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #4E6B58; font-size: 13px; font-weight: 700; overflow: hidden; align-self: center; }
.logo-preview.has-logo { border: 1px solid var(--line); }
.logo-preview img { width: 100%; height: 100%; object-fit: cover; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }

.mono { font-family: ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace; font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; }
.kv span:nth-child(odd) { color: var(--muted); }
.kv span:nth-child(even) { font-weight: 800; text-align: right; }

/* Fenêtre du bas (sheet) */
.overlay { position: fixed; inset: 0; background: rgba(35, 48, 42, 0.45); display: flex; flex-direction: column; justify-content: flex-end; z-index: 20; }
.sheet { width: 100%; max-width: 560px; margin: 0 auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 18px 20px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; max-height: 88vh; overflow-y: auto; }
.sheet-head { display: flex; align-items: center; gap: 8px; }
.sheet-title { font-size: 19px; font-weight: 800; color: var(--green); flex: 1; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: #3E4A43; display: flex; align-items: center; justify-content: center; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); max-width: min(92vw, 520px); background: var(--text); color: #fff; padding: 12px 18px; border-radius: 14px; font-size: 15px; font-weight: 700; z-index: 30; box-shadow: 0 6px 20px rgba(35, 48, 42, 0.25); }


/* Appel */
.week-nav { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.icon-plain { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--green); text-decoration: none; flex-shrink: 0; }
.week-label { flex: 1; display: flex; flex-direction: column; align-items: center; }
.week-day { font-size: 16px; font-weight: 800; }
.week-num { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot-red { width: 10px; height: 10px; border-radius: 50%; background: var(--red); display: inline-block; }
.att-table { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.att-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; display: flex; align-items: center; gap: 6px; padding: 10px 12px 10px 16px; background: #EEF3EC; border-bottom: 1px solid var(--line); border-radius: var(--radius) var(--radius) 0 0; font-size: 12px; font-weight: 800; color: var(--muted); }
.att-col { width: 48px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.att-col b { font-size: 14px; color: var(--text); }
.att-row { display: flex; align-items: center; gap: 6px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--line-soft); }
.att-row:last-child { border-bottom: none; }
.att-name { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.att-n { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 6px; overflow-wrap: anywhere; }
.att-sub { font-size: 12px; color: var(--muted); }
.att-sub.red { color: var(--red-text); font-weight: 700; }
.bang { width: 20px; height: 20px; border-radius: 50%; background: var(--red); color: #fff; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.mk { width: 48px; height: 44px; flex-shrink: 0; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 17px; font-weight: 800; }
.mk.on[data-v="P"] { background: #2F5D45; border-color: #2F5D45; color: #fff; }
.mk.on[data-v="A"] { background: #C0392B; border-color: #C0392B; color: #fff; }
.mk.on[data-v="J"] { background: #2F5873; border-color: #2F5873; color: #fff; }
.mk.on[data-v="R"] { background: #A35A12; border-color: #A35A12; color: #fff; }
.sticky-foot { position: sticky; bottom: 0; padding: 12px 0 calc(8px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to bottom, rgba(246,243,236,0), var(--bg) 30%); }
.vac-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; }
.vac { height: 54px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; }
.vac b { font-size: 14px; }
.vac.on { background: #CFC8B8; border-color: #B9B2A3; }
@media (max-width: 360px) { .mk, .att-col { width: 42px; } .att-row, .att-head { padding-left: 10px; padding-right: 8px; gap: 4px; } }

/* Étapes 3 à 6 */
.stack { display: flex; flex-direction: column; gap: 10px; }
.arrow { border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.lesson-card { display: flex; flex-direction: column; gap: 6px; padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); color: var(--text); text-decoration: none; }
.lesson-top { display: flex; align-items: center; gap: 8px; }
.lesson-n { font-size: 16px; font-weight: 800; color: var(--green); }
.lesson-ar { font-size: 21px; line-height: 1.5; text-align: right; }
.lesson-title { font-size: 21px; line-height: 1.5; text-align: right; }
.pill-amber { height: 24px; padding: 0 9px; border-radius: 12px; background: var(--amber-bg); border: 1px solid #EED9A4; color: var(--amber-text); font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap; }
.pill-green { height: 24px; padding: 0 9px; border-radius: 12px; background: var(--tint); color: var(--green); font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; }
.other-level { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.other-level summary { min-height: 52px; padding: 14px 16px; font-weight: 700; cursor: pointer; }
.other-level .stack { padding: 0 12px 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; font-weight: 700; color: var(--muted); }
.banner.blue { background: #E6EEF4; color: #24485F; }
.ev-head .ev-col { width: 44px; flex-shrink: 0; text-align: center; font-size: 12px; }
.ev-head .notes-col { width: 46px; color: var(--amber-text); }
.ev-row { display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--line-soft); }
.ev-row:last-child { border-bottom: none; }
.ev-name { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.ev-n { display: flex; align-items: center; gap: 5px; font-size: 15px; font-weight: 800; overflow-wrap: anywhere; }
.cell { width: 44px; height: 44px; flex-shrink: 0; border-radius: 10px; font-size: 13px; font-weight: 800; background: var(--bg); color: var(--muted); border: 1.5px dashed #CFC8B8; }
.cell.v2 { background: #2F7D4F; color: #fff; border: 1px solid #2F7D4F; }
.cell.v1 { background: #F2C94C; color: #4A3A08; border: 1px solid #E0B43A; }
.cell.v0 { background: #C0392B; color: #fff; border: 1px solid #C0392B; }
.cell.pref { opacity: 0.78; }
.absent-cells { width: 188px; flex-shrink: 0; text-align: center; font-size: 13px; color: var(--muted); }
.mini { height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--green); font-size: 13px; font-weight: 800; display: inline-flex; align-items: center; gap: 4px; }
.mini.green { border-color: #9CC3A6; background: var(--tint); }
.mini.solid { background: var(--green); color: #fff; border-color: var(--green); }
.mini.amber { background: var(--amber-bg); border-color: #E2C98A; color: var(--amber-text); }
.ev-name .mini { height: 26px; font-size: 12px; padding: 0 8px; border-color: #2F7D4F; color: #2F7D4F; }
.ev-name .mini.green { border-color: #9CC3A6; color: var(--green); }
.notes-btn { width: 46px; height: 44px; flex-shrink: 0; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 3px; }
.notes-btn.has { background: var(--amber-bg); border-color: #E2C98A; color: var(--amber-text); }
.saved-line { margin: 0 0 8px; text-align: center; font-size: 13px; font-weight: 700; color: var(--green); }
.row-flex { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sub-label { font-size: 13px; font-weight: 800; color: var(--muted); margin-top: 6px; }
.sub-label.amber { color: var(--amber-text); }
.sub-label.red { color: var(--red-text); }
.sub-label.green { color: var(--green); }
.note { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--amber-bg); border: 1px solid #EED9A4; }
.note.done { background: #F1EFE8; border-color: var(--line); }
.note.done .note-text span:last-child { text-decoration: line-through; color: #6B746E; }
.note-text { display: flex; flex-direction: column; font-size: 15px; }
.note-meta { font-size: 12px; font-weight: 700; color: var(--muted); }
.note-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.comp-head.open { background: #FBF9F3; }
.comp-item { border-bottom: 1px solid var(--line-soft); }
.comp-item:last-child { border-bottom: none; }
.comp-item .row { border-bottom: none; }
.comp-panel { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 6px; background: #FBF9F3; }
.chk { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 6px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-align: left; font-size: 15px; font-weight: 700; }
.chk .box { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid #B9B2A3; background: var(--surface); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.chk .box svg { visibility: hidden; }
.chk.on .box svg { visibility: visible; }
.chk.neg.on { background: var(--red-bg); border-color: var(--red-line); color: #7A2219; }
.chk.neg.on .box { background: var(--red); border-color: var(--red); }
.chk.pos.on { background: var(--tint); border-color: #9CC3A6; color: #1F4231; }
.chk.pos.on .box { background: #2F7D4F; border-color: #2F7D4F; }
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: var(--line-soft); }
.tab { height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: #3E4A43; text-decoration: none; }
.tab.on { background: var(--green); color: #fff; }
.frise { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.frise.many { gap: 4px; }
.frise-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--muted); }
.progress { display: flex; gap: 4px; height: 14px; }
.prog-group { display: flex; gap: 2px; }
.prog-group span { flex: 1; border-radius: 3px; background: var(--line); }
.prog-group span.done { background: var(--green-soft); }
.prog-group span.cur { background: var(--green); box-shadow: 0 0 0 2px #F2C94C; }
.prog-labels { display: flex; gap: 4px; font-size: 12px; font-weight: 700; color: var(--muted); }
.prog-labels span:nth-child(2) { text-align: center; }
.prog-labels span:last-child { text-align: right; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.card.small { padding: 12px 14px; gap: 6px; border-radius: var(--radius); }
.card.amber { background: var(--amber-bg); border-color: #EED9A4; gap: 6px; color: #3E3215; }
.card.blue { background: #E6EEF4; border-color: #C5D6E2; gap: 10px; }
.big-num { font-size: 22px; font-weight: 800; }
.prop { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; background: var(--surface); }
.dist-row { display: flex; align-items: center; gap: 10px; min-height: 32px; color: var(--text); text-decoration: none; }

<script>
'use strict';

/* =========================================================
   Pôle Éducation — version 1.0.0, étape 1 (fondations)
   Toutes les données restent sur cet appareil (IndexedDB).
   ========================================================= */

const APP_VERSION = '2.0.0';
const TRASH_DAYS = 90;

const LEVELS = {
  'Débutant': [1, 3],
  'Moyen': [4, 9],
  'Avancé': [10, 17]

const LESSONS = {
  1: { fr: 'Lettres isolées', ar: 'الحروف الهجائية المفردة' },
  2: { fr: 'Lettres composées', ar: 'الحروف الهجائية المركبة' },

  5: { fr: 'Tanwîn', ar: 'التنوين' },
  6: { fr: 'Exercices voyelles et tanwîn', ar: 'تمرينات على الحركات والتنوين' },
  7: { fr: 'Petit alif, yâ et wâw', ar: 'الألف الصغيرة والياء الصغيرة والواو الصغيرة' },
  8: { fr: 'Madd et lîn', ar: 'حروف المد واللين' },
  9: { fr: 'Exercices sur le madd', ar: 'تمرينات على المد' },
  10: { fr: 'Soukoun', ar: 'السكون' },
  11: { fr: 'Exercices sur le soukoun', ar: 'تمرينات على السكون' },
  12: { fr: 'Chadda', ar: 'الشدة' },

  15: { fr: 'Madd obligatoire et permis', ar: 'المد الواجب والجائز' },
  16: { fr: 'Lâm solaire et lâm lunaire', ar: 'اللام الشمسية واللام القمرية' },
  17: { fr: 'Lettres écrites non prononcées', ar: 'الحروف التي تكتب ولا تنطق' }
};

/* ---------- Icônes (SVG) ---------- */
const I = {
  back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  chevron: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56645B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  close: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>',
  plus: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>',
  appel: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 12.5l2 2 4-4"/></svg>',
  livre: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5c3-1 6-1 9 1v14c-3-2-6-2-9-1z"/><path d="M21 5c-3-1-6-1-9 1v14c3-2 6-2 9-1z"/></svg>',
  drapeau: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h12l-2.5 4L17 12H5"/></svg>',
  courbe: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="M5 16l4-4 3 3 6-6"/><path d="M14 9h4v4"/></svg>',
  grille: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>',
  eleves: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-5 6-5s6 1.7 6 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.5c2.8 0 4.5 1.8 4.5 4.5"/></svg>',
  reglages: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9"/><path d="M18 7h2"/><path d="M4 17h4"/><path d="M13 17h7"/><circle cx="15.5" cy="7" r="2.5"/><circle cx="10.5" cy="17" r="2.5"/></svg>',
  aide: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.5V14"/><path d="M12 17h.01"/></svg>',
  loupe: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>',
  image: '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg>',
  upload: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>',
  download: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>',
  transfert: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-3-3"/><path d="M20 16H6l3 3"/></svg>',
  corbeille: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>',
  points: '<svg width="20" height="20" viewBox="0 0 24 24" fill="#56645B"><circle cx="12" cy="5.5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="18.5" r="1.7"/></svg>'
};

/* ---------- Outils ---------- */
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const norm = (s) => String(s).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const cleanName = (s) => cap(String(s).trim().replace(/\s+/g, ' '));

function isoWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
}
function nextSunday(from) {
  const d = new Date(from || Date.now());
  d.setHours(12, 0, 0, 0);
  d.setDate(d.getDate() + ((7 - d.getDay()) % 7));
  return d;
}
const fmtDay = (d) => d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtDateTime = (t) => new Date(t).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const fmtDate = (t) => new Date(t).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });

/* ---------- Base de données locale (IndexedDB) ---------- */
const DB_NAME = 'pole-education';
const DB_VERSION = 1;
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) { reject(new Error('Stockage indisponible sur ce navigateur')); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const d = req.result;
      // Les magasins des étapes suivantes sont créés dès maintenant pour éviter toute migration.
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      ['students', 'attendance', 'evaluations', 'notes', 'behaviour', 'trash'].forEach((name) => {
        if (!d.objectStoreNames.contains(name)) d.createObjectStore(name, { keyPath: 'id' });
      });
      ['history', 'log'].forEach((name) => {
        if (!d.objectStoreNames.contains(name)) d.createObjectStore(name, { keyPath: 'id', autoIncrement: true });
      });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error('Base bloquée : fermez les autres onglets de l\u2019application'));
  });
}
function run(store, mode, fn) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, mode);
    const st = tx.objectStore(store);
    let result;
    const r = fn(st);
    if (r) r.onsuccess = () => { result = r.result; };
    tx.oncomplete = () => resolve(result);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('Enregistrement annulé'));
  });
}
const dbGet = (store, key) => run(store, 'readonly', (s) => s.get(key));
const dbAll = (store) => run(store, 'readonly', (s) => s.getAll());
const dbPut = (store, value, key) => run(store, 'readwrite', (s) => (key === undefined ? s.put(value) : s.put(value, key)));
const dbDel = (store, key) => run(store, 'readwrite', (s) => s.delete(key));

/* ---------- Journal des erreurs et historique ---------- */
async function logError(message) {
  try { if (db) await dbPut('log', { at: Date.now(), msg: String(message).slice(0, 500) }); } catch (e) { /* rien à faire */ }
}
window.addEventListener('error', (e) => { logError((e.message || 'Erreur') + (e.filename ? ' · ' + e.filename.split('/').pop() + ':' + e.lineno : '')); });
window.addEventListener('unhandledrejection', (e) => { logError('Promesse : ' + ((e.reason && e.reason.message) || e.reason)); });

async function addHistory(what) {
  try { await dbPut('history', { at: Date.now(), what }); } catch (e) { logError('Historique : ' + e.message); }
}

/* ---------- Réglages ---------- */
const DEFAULT_SETTINGS = { profName: '', level: 'Moyen', logoOn: { home: true, bilan: true, comportement: true } };
let settings = { ...DEFAULT_SETTINGS };
let logo = null;

async function loadSettings() {
  const s = await dbGet('kv', 'settings');
  settings = Object.assign({}, DEFAULT_SETTINGS, s || {});
  settings.logoOn = Object.assign({}, DEFAULT_SETTINGS.logoOn, (s && s.logoOn) || {});
  logo = (await dbGet('kv', 'logo')) || null;
}
async function saveSettings() { await dbPut('kv', settings, 'settings'); }

/* ---------- Élèves ---------- */
async function getStudents() {
  const all = await dbAll('students');
  return all.sort((a, b) => a.name.localeCompare(b.name, 'fr'));
}
function lessonRange(level) { return LEVELS[level] || LEVELS.Moyen; }
function lessonOptions(selected, level) {
  let html = '';
  for (let n = 1; n <= 17; n++) {
    const [a, b] = lessonRange(level || settings.level);
    const tag = n >= a && n <= b ? '' : ' (autre niveau)';
    html += '<option value="' + n + '"' + (n === Number(selected) ? ' selected' : '') + '>Leçon ' + n + ' · ' + esc(LESSONS[n].fr) + tag + '</option>';
  }
  return html;
}

/* ---------- Corbeille ---------- */
async function toTrash(kind, label, data) {
  await dbPut('trash', { id: uid(), kind, label, data, at: Date.now() });
}
async function purgeTrash() {
  const limit = Date.now() - TRASH_DAYS * 86400000;
  const items = await dbAll('trash');
  for (const it of items) if (it.at < limit) await dbDel('trash', it.id);
}

/* ---------- Interface : fenêtre du bas, confirmation, message ---------- */
function openSheet(title, body) {
  $('#layer').innerHTML =
    '<div class="overlay" data-action="close-sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
    '<div class="sheet-head"><span class="sheet-title">' + esc(title) + '</span>' +
    '<button class="icon-btn" data-action="close-sheet" aria-label="Fermer">' + I.close + '</button></div>' +
    body + '</div></div>';
  const first = $('#layer .sheet input, #layer .sheet select');
  if (first && first.dataset.autofocus !== undefined) first.focus();
}
function closeSheet() { $('#layer').innerHTML = ''; }

function confirmBox(title, message, okLabel, danger) {
  return new Promise((resolve) => {
    openSheet(title,
      '<p style="margin:0;font-size:16px;line-height:1.45">' + message + '</p>' +
      '<div class="btn-row"><button class="btn ghost" data-action="confirm-no">Annuler</button>' +
      '<button class="btn ' + (danger ? 'danger' : '') + '" data-action="confirm-yes">' + esc(okLabel) + '</button></div>');
    confirmResolver = (v) => { closeSheet(); resolve(v); };
  });
}
let confirmResolver = null;

let toastTimer = null;
function toast(msg) {
  let el = $('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2800);
}

function header(title, sub, backTo) {
  return '<div class="top"><a class="back" href="' + (backTo || '#/') + '" aria-label="Retour">' + I.back + '</a>' +
    '<div class="top-text"><span class="top-title">' + esc(title) + '</span>' + (sub ? '<span class="top-sub">' + esc(sub) + '</span>' : '') + '</div></div>';
}

/* =========================================================
   Pages
   ========================================================= */
const pages = {};

pages.home = async () => {
  const students = await getStudents();
  const alertN = (await untreatedAlerts()).length;
  const next = nextSunday();
  const today = new Date().getDay() === 0;
  const when = (today ? 'aujourd\u2019hui' : fmtDay(next)) + ' · S' + isoWeek(next);
  const showLogo = logo && settings.logoOn.home;
  return '<div class="page">' +
    '<div class="home-head">' +
      '<a href="#/logo" class="logo-btn' + (showLogo ? ' has-logo' : '') + '" aria-label="' + (showLogo ? 'Logo de l\u2019établissement' : 'Ajouter le logo de l\u2019établissement') + '">' +
        (showLogo ? '<img src="' + logo + '" alt="">' : I.plus + '<span>LOGO</span>') + '</a>' +
      '<h1 class="home-name">Pôle Éducation</h1>' +
      '<span class="home-ar ar" lang="ar" dir="rtl">القاعدة النورانية</span>' +
      '<span class="home-meta">Classe ' + esc(settings.level) + ' · ' + esc(cap(when)) + '</span>' +
    '</div>' +
    (students.length === 0
      ? '<a href="#/eleves" class="banner info" style="text-decoration:none">Commencez par ajouter vos élèves : touchez ici.</a>'
      : '') +
    (students.length && Date.now() - Math.min(...students.map((x) => x.createdAt || Date.now())) > 14 * 86400000 && (!settings.lastBackupAt || Date.now() - settings.lastBackupAt > 30 * 86400000)

function readLogo(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) { reject(new Error('Choisissez une image PNG ou JPG.')); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const size = 512;
      const side = Math.min(img.naturalWidth, img.naturalHeight);
      const sx = (img.naturalWidth - side) / 2;
      const sy = (img.naturalHeight - side) / 2;
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, size, size);
      ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/png'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Cette image ne peut pas être lue. Essayez un autre fichier.')); };
    img.src = url;
  });
}

async function route(keepScroll) {
  const hash = location.hash.replace(/^#\/?/, '');
  const [name, ...params] = hash.split('/');
  const page = pages[name || 'home'] || pages.home;
  closeSheet();
  try {
    const html = await page(...params);
    $('#app').innerHTML = html;
  } catch (e) {
    logError('Affichage ' + (name || 'accueil') + ' : ' + e.message);
    $('#app').innerHTML = '<div class="page">' + header('Erreur') + '<div class="banner err">Cette page n\u2019a pas pu s\u2019afficher. Le problème est noté dans Paramètres › Diagnostic.</div><a class="btn" href="#/">Retour à l\u2019accueil</a></div>';
  }
  if (keepScroll !== true) window.scrollTo(0, 0);
  if (!name) maybeAskAlerts().catch((e) => logError('Alertes : ' + e.message));
}
window.addEventListener('hashchange', route);

/* =========================================================
   Étape 2 — Appel, alertes d'absences, semaines de vacances
   ========================================================= */
const MARKS = {
  P: { label: 'Présent', short: '✓' },
  A: { label: 'Absent', short: '✗' },
  J: { label: 'Absent justifié', short: 'J' },
  R: { label: 'Retard', short: 'R' }
};
const ABS_LIMIT = 3;

const pad2 = (n) => String(n).padStart(2, '0');
const toKey = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const fromKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
function lastSunday(from) {
  const d = new Date(from || Date.now());
  d.setHours(12, 0, 0, 0);
  d.setDate(d.getDate() - d.getDay());
  return d;
}
function addDays(key, n) { const d = fromKey(key); d.setDate(d.getDate() + n); return toKey(d); }
function schoolYearStartKey(ref) {
  const d = ref ? fromKey(ref) : new Date();
  const y = d.getMonth() >= 8 ? d.getFullYear() : d.getFullYear() - 1;
  return y + '-09-01';
}
const fmtShort = (key) => fromKey(key).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });

async function getSession(key) {
  return (await dbGet('attendance', key)) || { id: key, marks: {}, vacation: false, validated: false };
}
async function saveSession(s) { s.updatedAt = Date.now(); await dbPut('attendance', s); }

/* Nombre d'absences non justifiées depuis la rentrée (1er septembre), vacances exclues. */
async function absenceCounts() {
  const start = schoolYearStartKey();
  const counts = {};
  (await dbAll('attendance')).forEach((s) => {
    if (s.id < start || s.vacation) return;
    Object.keys(s.marks || {}).forEach((sid) => { if (s.marks[sid] === 'A') counts[sid] = (counts[sid] || 0) + 1; });
  });
  return counts;
}

async function getAlerts() { return (await dbGet('kv', 'alerts')) || {}; }
async function checkAlerts(currentKey) {
  const [counts, alerts, students] = await Promise.all([absenceCounts(), getAlerts(), getStudents()]);
  let changed = false;
  const fresh = [];
  students.forEach((st) => {
    const n = counts[st.id] || 0;
    const a = alerts[st.id];
    if (n >= ABS_LIMIT && !a) {
      alerts[st.id] = { reachedAt: currentKey || toKey(new Date()), treated: false, year: schoolYearStartKey() };
      changed = true;
      fresh.push(st.name);
    } else if (a && n < ABS_LIMIT && !a.treated) {
      delete alerts[st.id];
      changed = true;
    }
  });
  if (changed) await dbPut('kv', alerts, 'alerts');
  for (const name of fresh) await addHistory('Alerte : ' + name + ' a atteint ' + ABS_LIMIT + ' absences non justifiées');
  return alerts;
}
async function untreatedAlerts() {
  const [alerts, students] = await Promise.all([getAlerts(), getStudents()]);
  const year = schoolYearStartKey();
  return students.filter((s) => alerts[s.id] && !alerts[s.id].treated && alerts[s.id].year === year)
    .map((s) => ({ id: s.id, name: s.name, at: alerts[s.id].reachedAt }));
}

/* ----- Page Appel ----- */
pages.appel = async (param) => {
  const today = new Date();
  const defKey = toKey(lastSunday(today));
  const maxKey = toKey(nextSunday(today));
  const key = /^\d{4}-\d{2}-\d{2}$/.test(param || '') && fromKey(param).getDay() === 0 ? param : defKey;
  const [session, students, counts, alertsList] = await Promise.all([getSession(key), getStudents(), absenceCounts(), untreatedAlerts()]);
  const d = fromKey(key);
  const weekDot = alertsList.some((a) => a.at === key);
  const nav =
    '<div class="week-nav">' +
      '<a class="icon-plain" href="#/appel/' + addDays(key, -7) + '" aria-label="Dimanche précédent">' + I.back + '</a>' +
      '<div class="week-label"><span class="week-day">' + esc(cap(fmtDay(d))) + '</span>' +
        '<span class="week-num">Semaine S' + isoWeek(d) + (key === toKey(lastSunday(today)) && today.getDay() === 0 ? ' · aujourd\u2019hui' : '') +
        (weekDot ? ' <span class="dot-red" aria-label="Alerte d\u2019absences cette semaine"></span>' : '') + '</span></div>' +
      (key < maxKey
        ? '<a class="icon-plain" href="#/appel/' + addDays(key, 7) + '" aria-label="Dimanche suivant" style="transform:scaleX(-1)">' + I.back + '</a>'
        : '<span class="icon-plain" aria-hidden="true"></span>') +
    '</div>';

  if (!students.length) {
    return '<div class="page">' + header('Appel', 'Classe ' + settings.level) + nav +
      '<div class="empty"><span style="font-size:17px;font-weight:800;color:var(--text)">Aucun élève dans la classe</span><span>Ajoutez d\u2019abord vos élèves pour pouvoir faire l\u2019appel.</span><a class="btn" href="#/eleves">Ajouter des élèves</a></div></div>';
  }
  if (session.vacation) {
    return '<div class="page">' + header('Appel', 'Classe ' + settings.level) + nav +
      '<div class="banner warn">Ce dimanche est marqué comme <b>semaine de vacances</b> : pas d\u2019appel, et il ne compte pas dans les bilans.</div>' +
      '<button class="btn light full" data-action="toggle-vacation" data-key="' + key + '">Ce n\u2019était pas des vacances</button></div>';
  }

  const tally = { P: 0, A: 0, J: 0, R: 0 };
  students.forEach((s) => { const m = session.marks[s.id]; if (tally[m] !== undefined) tally[m]++; });
  const rows = students.map((s) => {
    const m = session.marks[s.id];
    const n = counts[s.id] || 0;
    const alert = n >= ABS_LIMIT;
    const btns = ['P', 'A', 'J', 'R'].map((v) =>
      '<button class="mk' + (m === v ? ' on' : '') + '" data-v="' + v + '" data-action="mark" data-sid="' + esc(s.id) + '" data-key="' + key + '" aria-pressed="' + (m === v) + '" aria-label="' + MARKS[v].label + ' : ' + esc(s.name) + '">' + MARKS[v].short + '</button>').join('');
    return '<div class="att-row" data-name="' + esc(norm(s.name)) + '" data-row="' + esc(s.id) + '">' +
      '<div class="att-name"><span class="att-n">' + esc(s.name) + (alert ? ' <span class="bang" aria-label="Alerte">!</span>' : '') + '</span>' +
        '<span class="att-sub' + (alert ? ' red' : '') + '" data-sub="' + esc(s.id) + '">' + (n ? n + ' absence' + (n > 1 ? 's' : '') + ' cette année' : '') + '</span></div>' +
      btns + '</div>';
  }).join('');
  const missing = students.filter((s) => !session.marks[s.id]).length;

  return '<div class="page appel-page">' + header('Appel', 'Classe ' + settings.level) + nav +
    (alertsList.length ? '<button class="banner err" style="border:none;text-align:left;display:flex;align-items:center;gap:10px" data-action="open-alerts"><span class="bang">!</span><span style="flex:1">' +
      esc(alertsList.map((a) => a.name).join(', ')) + ' : ' + ABS_LIMIT + ' absences non justifiées. Alerte à traiter.</span><span style="text-decoration:underline">Traiter</span></button>' : '') +
    '<label class="search">' + I.loupe + '<input id="search-appel" type="search" placeholder="Rechercher un élève" autocomplete="off" aria-label="Rechercher un élève"></label>' +
    '<button class="btn light full" data-action="all-present" data-key="' + key + '">' + I.appel + 'Tout le monde présent</button>' +
    '<div class="att-table">' +
      '<div class="att-head"><span class="att-name">Élève</span>' +
        '<span class="att-col" style="color:#2F5D45">Présent<b id="t-P">' + tally.P + '</b></span>' +
        '<span class="att-col" style="color:#9B2C21">Absent<b id="t-A">' + tally.A + '</b></span>' +
        '<span class="att-col" style="color:#2F5873">Justifié<b id="t-J">' + tally.J + '</b></span>' +
        '<span class="att-col" style="color:#8A4E14">Retard<b id="t-R">' + tally.R + '</b></span></div>' +
      rows +
    '</div>' +
    '<p class="hint" id="no-result" hidden style="text-align:center">Aucun élève ne correspond à cette recherche.</p>' +
    '<button class="btn ghost full" style="border:none;text-decoration:underline" data-action="toggle-vacation" data-key="' + key + '">Marquer ce dimanche comme vacances</button>' +
    '<div class="sticky-foot"><button class="btn full" data-action="validate-appel" data-key="' + key + '" id="validate-btn">' + validateLabel(missing, session.validated) + '</button></div>' +
  '</div>';
};
function validateLabel(missing, validated) {
  if (missing > 0) return 'Valider l\u2019appel (' + missing + ' non saisi' + (missing > 1 ? 's' : '') + ')';
  return validated ? 'Appel validé ✓ · revenir à l\u2019accueil' : 'Valider l\u2019appel';
}

async function refreshAppelCounts(key) {
  const [session, students, counts] = await Promise.all([getSession(key), getStudents(), absenceCounts()]);
  const tally = { P: 0, A: 0, J: 0, R: 0 };
  students.forEach((s) => {
    const m = session.marks[s.id];
    if (tally[m] !== undefined) tally[m]++;
    const row = document.querySelector('[data-row="' + CSS.escape(s.id) + '"]');
    if (row) {
      row.querySelectorAll('.mk').forEach((b) => { const on = b.dataset.v === m; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
      const n = counts[s.id] || 0;
      const sub = row.querySelector('[data-sub]');
      if (sub) { sub.textContent = n ? n + ' absence' + (n > 1 ? 's' : '') + ' cette année' : ''; sub.classList.toggle('red', n >= ABS_LIMIT); }
      const nameEl = row.querySelector('.att-n');
      if (nameEl) nameEl.innerHTML = esc(s.name) + (n >= ABS_LIMIT ? ' <span class="bang" aria-label="Alerte">!</span>' : '');
    }
  });
  Object.keys(tally).forEach((k) => { const el = document.getElementById('t-' + k); if (el) el.textContent = tally[k]; });
  const btn = document.getElementById('validate-btn');
  if (btn) btn.textContent = validateLabel(students.filter((s) => !session.marks[s.id]).length, session.validated);
}

/* ----- Semaines de vacances ----- */
pages.vacances = async () => {
  const start = fromKey(schoolYearStartKey());
  let d = new Date(start); d.setDate(d.getDate() + ((7 - d.getDay()) % 7));
  const end = fromKey(addDays(toKey(nextSunday()), 7 * 12));
  const sessions = {};
  (await dbAll('attendance')).forEach((s) => { sessions[s.id] = s; });
  let html = '';
  let month = '';
  while (d <= end) {
    const key = toKey(d);
    const m = d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
    if (m !== month) { if (month) html += '</div>'; html += '<span class="section-label">' + esc(cap(m)) + '</span><div class="vac-grid">'; month = m; }
    const on = sessions[key] && sessions[key].vacation;
    html += '<button class="vac' + (on ? ' on' : '') + '" data-action="toggle-vacation" data-key="' + key + '" data-stay="1" aria-pressed="' + !!on + '">' +
      '<b>S' + isoWeek(d) + '</b><span>' + d.getDate() + ' ' + esc(d.toLocaleDateString('fr-FR', { month: 'short' })) + '</span></button>';
    d.setDate(d.getDate() + 7);
  }
  if (month) html += '</div>';
  return '<div class="page">' + header('Semaines de vacances', 'Touchez un dimanche pour le marquer', '#/parametres') +
    '<p class="hint" style="margin:0">Les dimanches en gris sont des vacances : pas d\u2019appel, et ils ne comptent pas dans les bilans.</p>' + html + '</div>';
};

/* ----- Fenêtre d'alerte à l'ouverture ----- */
let alertsAsked = false;
async function maybeAskAlerts() {
  if (alertsAsked) return;
  const list = await untreatedAlerts();
  if (!list.length) return;
  alertsAsked = true;
  openSheet('Alerte absences',
    '<p style="margin:0;font-size:15px;line-height:1.45">Ces élèves ont atteint <b>' + ABS_LIMIT + ' absences non justifiées</b> cette année. Avez-vous traité l\u2019alerte (parents prévenus) ?</p>' +
    '<div class="group">' + list.map((a) =>
      '<div class="row"><span class="bang">!</span><span class="row-main">' + esc(a.name) + '<span class="row-sub">Depuis le ' + esc(fmtShort(a.at)) + '</span></span>' +
      '<button class="btn" style="height:40px;font-size:14px;padding:0 14px" data-action="treat-alert" data-sid="' + esc(a.id) + '">Traité</button></div>').join('') + '</div>' +
    '<button class="btn ghost full" data-action="close-sheet">Plus tard</button>');
}

Object.assign(actions, {
  'open-alerts': async () => { alertsAsked = false; await maybeAskAlerts(); },
  mark: async (el) => {
    const key = el.dataset.key;
    const sid = el.dataset.sid;
    const v = el.dataset.v;
    const s = await getSession(key);
    const old = s.marks[sid];
    if (old === v) return;
    s.marks[sid] = v;
    s.vacation = false;
    await saveSession(s);
    if (old) {
      const st = await dbGet('students', sid);
      await addHistory('Appel du ' + fmtShort(key) + ' · ' + (st ? st.name : 'élève') + ' : ' + MARKS[old].label + ' → ' + MARKS[v].label);
    }
    if (old === 'A' || v === 'A') {
      const before = (await untreatedAlerts()).length;
      await checkAlerts(key);
      if ((await untreatedAlerts()).length !== before) { await route(true); return; }
    }
    await refreshAppelCounts(key);
  },
  'all-present': async (el) => {
    const key = el.dataset.key;
    const [s, students] = await Promise.all([getSession(key), getStudents()]);
    const todo = students.filter((st) => !s.marks[st.id]);
    if (!todo.length) { toast('Tous les élèves ont déjà une saisie. Touchez une case pour la changer.'); return; }
    todo.forEach((st) => { s.marks[st.id] = 'P'; });
    await saveSession(s);
    await refreshAppelCounts(key);
    toast(todo.length + ' élève' + (todo.length > 1 ? 's marqués présents.' : ' marqué présent.'));
  },
  'toggle-vacation': async (el) => {
    const key = el.dataset.key;
    const s = await getSession(key);
    if (!s.vacation && Object.keys(s.marks).length) {
      const ok = await confirmBox('Marquer comme vacances ?', 'Un appel a déjà été saisi pour le ' + esc(fmtShort(key)) + '. Il sera conservé mais ne comptera plus dans les absences ni dans les bilans.', 'Marquer comme vacances', false);
      if (!ok) return;
    }
    s.vacation = !s.vacation;
    await saveSession(s);
    await checkAlerts(key);
    await addHistory((s.vacation ? 'Vacances : ' : 'Fin de vacances : ') + 'dimanche ' + fmtShort(key));
    toast(s.vacation ? 'Dimanche marqué comme vacances.' : 'Dimanche remis en cours normal.');
    route(true);
  },
  'validate-appel': async (el) => {
    const key = el.dataset.key;
    const [s, students] = await Promise.all([getSession(key), getStudents()]);
    const missing = students.filter((st) => !s.marks[st.id]);
    if (missing.length) {
      const ok = await confirmBox('Élèves sans saisie', missing.length === 1
        ? '<b>' + esc(missing[0].name) + '</b> n\u2019a pas encore de saisie. Valider quand même ?'
        : missing.length + ' élèves n\u2019ont pas encore de saisie. Valider quand même ?', 'Valider quand même', false);
      if (!ok) return;
    }
    const first = !s.validated;
    s.validated = true;
    await saveSession(s);
    await checkAlerts(key);
    if (first) await addHistory('Appel du ' + fmtShort(key) + ' validé');
    toast('Appel enregistré.');
    alertsAsked = false;
    location.hash = '#/';
  },
  'treat-alert': async (el) => {
    const alerts = await getAlerts();
    const a = alerts[el.dataset.sid];
    if (!a) return;
    a.treated = true;
    a.treatedAt = Date.now();
    await dbPut('kv', alerts, 'alerts');
    const st = await dbGet('students', el.dataset.sid);
    await addHistory('Alerte d\u2019absences traitée : ' + (st ? st.name : 'élève'));
    const row = el.closest('.row');
    if (row) row.remove();
    if (!document.querySelector('#layer [data-action="treat-alert"]')) closeSheet();
    toast('Alerte marquée comme traitée.');
    if (!location.hash || location.hash === '#/') route(true);
  }
});

/* Dernier dimanche avec des données (au plus le prochain dimanche), pour les bilans. */
async function reportRef() {
  const base = refKey();

  (await dbAll('attendance')).forEach((x) => { if (!x.vacation && Object.keys(x.marks || {}).length) consider(x.id); });
  (await dbAll('evaluations')).forEach((e) => consider(e.date));
  return best;
}
const levelOfLesson = (n) => LEVEL_ORDER.find((l) => n >= LEVELS[l][0] && n <= LEVELS[l][1]) || 'Moyen';

function levelOf(p) {
  if (p >= 90) return { label: 'Excellent', color: '#2F7D4F', rot: -90 };
  if (p >= 65) return { label: 'Bon', color: '#5E9A5E', rot: -45 };
  if (p >= 40) return { label: 'Moyen', color: '#B8901C', rot: 0 };
  if (p >= 20) return { label: 'Fragile', color: '#D07424', rot: 45 };
  return { label: 'En difficulté', color: '#C0392B', rot: 90 };
}
const NO_LEVEL = { label: 'À saisir', color: '#B5BDB7', rot: 0 };
function pctOf(vals) {
  const f = (vals || []).filter((v) => v !== null && v !== undefined);
  return f.length ? Math.round(f.reduce((a, b) => a + b, 0) / (f.length * 2) * 100) : null;
}
function arrowChip(lv, size) {

}
function weekNav(base, key, maxKey) {

}

/* ---------- Données d'évaluation et de notes ---------- */
async function evalIndex() {

/* ---------- Bilans ---------- */
function periodKeys(period, ref) {
  if (period === 'sem') return [ref];
  if (period === 'w4') return [0, 1, 2, 3].map((i) => addDays(ref, -7 * i)).reverse();
  if (period === 'mois') {
    const d = fromKey(ref);
    const keys = [];
    let k = ref;
    while (fromKey(k).getMonth() === d.getMonth()) { keys.unshift(k); k = addDays(k, -7); }
    return keys;
  }
  return Array.from({ length: 13 }, (_, i) => addDays(ref, -7 * i)).reverse();
}
const PERIODS = { sem: 'Semaine', w4: '4 sem.', mois: 'Mois', tri: 'Trimestre' };
function periodTitle(period, keys) {
  const a = fromKey(keys[0]), b = fromKey(keys[keys.length - 1]);
  if (period === 'sem') return 'Semaine S' + isoWeek(a);
  if (period === 'mois') return 'Mois de ' + a.toLocaleDateString('fr-FR', { month: 'long' });
  return (period === 'w4' ? '4 dernières semaines' : 'Trimestre') + ' · S' + isoWeek(a) + ' à S' + isoWeek(b);
}

async function studentReport(sid, period, ref) {
  const [s, sessionsArr, ev, behav, notes] = await Promise.all([dbGet('students', sid), dbAll('attendance'), evalIndex(), dbAll('behaviour'), notesOf(sid)]);
  const sessions = {};
  sessionsArr.forEach((x) => { sessions[x.id] = x; });
  const evs = {};
  (ev[sid] || []).forEach((e) => { evs[e.date] = e; });
  const itemFor = (k) => {
    const ss = sessions[k];
    if (ss && ss.vacation) return { k, type: 'V' };
    const m = ss && ss.marks[sid];
    if (m === 'A') return { k, type: 'ABS' };
    if (m === 'J') return { k, type: 'J' };
    const e = evs[k];
    const p = e ? pctOf(e.vals) : null;
    if (p !== null) return { k, type: 'C', pct: p, lv: levelOf(p), vals: e.vals, lesson: e.lesson, late: m === 'R' };
    return { k, type: 'none', late: m === 'R' };
  };
  const keys = periodKeys(period, ref);
  const items = keys.map(itemFor);
  const courses = items.filter((x) => x.type === 'C');
  const avgP = courses.length ? Math.round(courses.reduce((a, b) => a + b.pct, 0) / courses.length) : null;
  const good = courses.filter((x) => x.pct >= 65).length;
  const absN = items.filter((x) => x.type === 'ABS').length;
  let trend = 'reste stable';
  if (courses.length >= 2) {
    const lastP = courses[courses.length - 1].pct;
    const diff = lastP - courses[0].pct;
    if (diff >= 10) trend = 'progresse bien';
    else if (diff <= -10 && lastP < 65) trend = 'est en baisse';
    else if (lastP >= 65) trend = 'garde un bon niveau';
  }
  const name = s ? s.name : 'L\u2019élève';
  let phrase;
  if (!courses.length) phrase = absN ? name + ' était absent' + ' sur cette période.' : 'Aucune évaluation sur cette période.';
  else if (courses.length === 1) phrase = name + ' a eu un cours « ' + levelOf(courses[0].pct).label + ' » sur cette période.';
  else phrase = name + ' ' + trend + ' : ' + good + ' bon' + (good > 1 ? 's' : '') + ' cours sur ' + courses.length + '.';
  if (absN && courses.length) phrase += ' ' + absN + ' absence' + (absN > 1 ? 's' : '') + ' sur la période.';
  // 5 derniers cours (hors vacances et sans données)
  const last5 = [];
  for (let i = 0, k = ref; i < 60 && last5.length < 5; i++, k = addDays(k, -7)) {
    const it = itemFor(k);
    if (it.type === 'C' || it.type === 'ABS' || it.type === 'J') last5.unshift(it);
  }
  const lastCourses = [];
  for (let i = 0, k = ref; i < 60 && lastCourses.length < 4; i++, k = addDays(k, -7)) {
    const it = itemFor(k);
    if (it.type === 'C') lastCourses.unshift(it);
  }
  const start = schoolYearStartKey(ref);
  const year = { A: 0, J: 0, R: 0 };
  sessionsArr.forEach((x) => { if (x.id >= start && x.id <= ref && !x.vacation) { const m = x.marks[sid]; if (year[m] !== undefined) year[m]++; } });
  const pres = { P: 0, A: 0, J: 0, R: 0 };
  keys.forEach((k) => { const ss = sessions[k]; if (ss && !ss.vacation) { const m = ss.marks[sid]; if (pres[m] !== undefined) pres[m]++; } });
  const behaviours = behav.filter((b) => b.sid === sid && keys.includes(b.date) && (b.neg.length || b.pos.length)).sort((a, b) => (a.date < b.date ? -1 : 1));
  return {
    s, period, ref, keys, items, courses, avgP, avg: avgP === null ? NO_LEVEL : levelOf(avgP), phrase, last5, lastCourses, year, pres, behaviours,
    pending: notes.filter((n) => !n.done).sort((a, b) => (a.date < b.date ? 1 : -1))
  };
}
function itemChip(it, size) {
  if (it.type === 'C') return arrowChip(it.lv, size);
  const map = { V: ['#CFC8B8', '#23302A', 'V'], ABS: ['#9B2C21', '#fff', 'ABS'], J: ['#2F5873', '#fff', 'J'], none: ['#ECE7DB', '#56645B', '–'] };
  const m = map[it.type];
  return '<span class="arrow" style="width:' + size + 'px;height:' + size + 'px;background:' + m[0] + ';color:' + m[1] + ';font-size:' + (size > 30 ? 11 : 9) + 'px;font-weight:800">' + m[2] + '</span>';
}

}

/* ---------- Vue d'ensemble de la classe ---------- */
async function classReport() {
  const ref = await reportRef();
  const [students, ev, sessionsArr, alerts, dismissed] = await Promise.all([getStudents(), evalIndex(), dbAll('attendance'), untreatedAlerts(), dbGet('kv', 'dismissed')]);
  const dis = dismissed || {};
  const keys = periodKeys('w4', ref);
  const sessions = {};
  sessionsArr.forEach((x) => { sessions[x.id] = x; });
  let pres = 0, tot = 0;
  keys.forEach((k) => { const ss = sessions[k]; if (ss && !ss.vacation) Object.values(ss.marks).forEach((m) => { tot++; if (m === 'P' || m === 'R') pres++; }); });
  const recent = [];
  students.forEach((s) => (ev[s.id] || []).forEach((e) => { if (keys.includes(e.date) && pctOf(e.vals) !== null) recent.push(pctOf(e.vals)); }));
  const avgP = recent.length ? Math.round(recent.reduce((a, b) => a + b, 0) / recent.length) : null;
  const proposals = [];
  const watch = [];
  const latest = {};
  students.forEach((s) => {
    const list = (ev[s.id] || []).filter((e) => e.date <= ref && pctOf(e.vals) !== null);
    const last = list[list.length - 1];
    latest[s.id] = last;
    const lvl = levelOfLesson(s.lesson);
    const idx = LEVEL_ORDER.indexOf(lvl);
    const last3 = list.slice(-3), last4 = list.slice(-4);
    if (last && s.lesson === LEVELS[lvl][1] && idx < 2 && last3.length === 3 && last3.every((e) => pctOf(e.vals) >= 65)) {
      const id = s.id + '|up';
      if (dis[id] !== last.date) proposals.push({ id, sid: s.id, name: s.name, to: LEVEL_ORDER[idx + 1], lesson: LEVELS[LEVEL_ORDER[idx + 1]][0], why: 'A terminé la leçon ' + s.lesson + ' (fin du niveau ' + lvl + ') avec 3 bons cours d\u2019affilée.', last: last.date });
    }
    if (last && idx > 0 && last4.length === 4 && last4.every((e) => pctOf(e.vals) < 40)) {
      const id = s.id + '|down';
      if (dis[id] !== last.date) proposals.push({ id, sid: s.id, name: s.name, to: LEVEL_ORDER[idx - 1], lesson: LEVELS[LEVEL_ORDER[idx - 1]][0], why: '4 cours d\u2019affilée en « Fragile » ou « En difficulté » sur la leçon ' + s.lesson + '.', last: last.date });
    }
    if (last && pctOf(last.vals) < 40) {
      const lv = levelOf(pctOf(last.vals));
      watch.push({ sid: s.id, name: s.name, lv, why: lv.label + ' · leçon ' + s.lesson + ' (' + fmtShort(last.date) + ')' });
    }
  });
  alerts.forEach((a) => { if (!watch.some((w) => w.sid === a.id)) watch.push({ sid: a.id, name: a.name, bang: true, why: ABS_LIMIT + ' absences non justifiées cette année' }); });
  // Répartition par leçon et difficulté
  const lessonsUsed = new Set(students.map((s) => s.lesson));
  const [a, b] = lessonRange(settings.level);
  for (let n = a; n <= b; n++) lessonsUsed.add(n);
  const dist = Array.from(lessonsUsed).sort((x, y) => x - y).map((n) => {
    const on = students.filter((s) => s.lesson === n);
    let nonA = 0, total = 0;
    const crit = [0, 0, 0, 0];
    on.forEach((s) => { const l = latest[s.id]; if (l && l.lesson === n) l.vals.forEach((v, i) => { if (v !== null) { total++; if (v !== 2) { nonA++; crit[i]++; } } }); });
    return { n, count: on.length, share: total ? nonA / total : 0, total, crit, notA: on.filter((s) => latest[s.id] && latest[s.id].lesson === n && latest[s.id].vals.some((v) => v !== null && v !== 2)).length };
  });
  const hardest = dist.filter((d) => d.total).sort((x, y) => y.share - x.share)[0] || null;
  const max = Math.max(1, ...dist.map((d) => d.count));
  return { ref, students, presRate: tot ? Math.round(pres / tot * 100) : null, avgP, avg: avgP === null ? NO_LEVEL : levelOf(avgP), proposals, watch, dist, hardest, max };
}

/* =========================================================
   PDF (rendu hors ligne : html2canvas + jsPDF intégrés)
   ========================================================= */
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('Chargement impossible : ' + src));
    document.head.appendChild(s);
  });
}
async function loadPdfLibs() {
  if (!window.html2canvas) {
    try { await loadScript('lib/html2canvas.min.js'); } catch (e) { await loadScript('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'); }
  }
  if (!window.jspdf) {
    try { await loadScript('lib/jspdf.umd.min.js'); } catch (e) { await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js'); }
  }
}
const isMobile = () => /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
async function shareOrDownload(blob, filename, title) {
  const file = new File([blob], filename, { type: blob.type });
  if (isMobile() && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; logError('Partage : ' + e.message); }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
function pdfHeader(title, right, showLogo) {
  return '<div class="pp-head">' +
    (showLogo && logo ? '<img src="' + logo + '" class="pp-logo" alt="">' : '') +
    '<div style="flex:1;display:flex;flex-direction:column"><span class="pp-kicker">Pôle Éducation' + (settings.profName ? ' · ' + esc(settings.profName) : '') + '</span><span class="pp-title">' + esc(title) + '</span></div>' +
    '<div class="pp-right">' + right + '</div></div>';
}
const pdfFooter = (n, total) => '<div class="pp-foot">Document interne · généré par Pôle Éducation le ' + esc(fmtDate(Date.now())) + ' · page ' + n + '/' + total + '</div>';
const pdfSign = (right) => '<div class="pp-sign"><div><b>Signature du professeur</b><span></span></div><div><b>' + right + '</b><span></span></div></div>';

async function makePDF(pagesHTML, filename, title) {
  toast('Création du PDF…');
  await loadPdfLibs();
  const host = document.createElement('div');
  host.className = 'pp-host';
  host.innerHTML = pagesHTML.map((p) => '<div class="pp">' + p + '</div>').join('');
  document.body.appendChild(host);
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', compress: true });
    const pages = host.querySelectorAll('.pp');
    for (let i = 0; i < pages.length; i++) {
      const canvas = await window.html2canvas(pages[i], { scale: 2, backgroundColor: '#ffffff', logging: false });
      if (i > 0) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);
    }
    await shareOrDownload(pdf.output('blob'), filename, title);
  } finally {
    host.remove();
  }
}
const fileSafe = (s) => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

async function pdfComportement(key) {
  const [students, recsAll] = await Promise.all([getStudents(), dbAll('behaviour')]);
  const names = {};
  students.forEach((s) => { names[s.id] = s.name; });
  const recs = recsAll.filter((r) => r.date === key && names[r.sid]);
  const negR = recs.filter((r) => r.neg.length).sort((a, b) => Math.min(...a.neg) - Math.min(...b.neg));
  const posR = recs.filter((r) => r.pos.length);
  const d = fromKey(key);
  const head = pdfHeader('Fiche de suivi du comportement',
    '<b>' + esc(cap(d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }))) + '</b><span>Semaine S' + isoWeek(d) + '</span><span>Classe ' + esc(settings.level) + '</span>', settings.logoOn.comportement);
  const stats = '<div class="pp-stats"><div class="red"><span>Élèves signalés</span><b>' + negR.length + '</b></div><div class="green"><span>Points positifs</span><b>' + posR.length + '</b></div><div><span>Professeur</span><b style="font-size:15px">' + (settings.profName ? esc(settings.profName) : '________________') + '</b></div></div>';
  const tableRows = (list, kind) => list.map((r) => '<tr><td><b>' + esc(names[r.sid]) + '</b></td><td>' + r[kind].map((i) => '• ' + esc((kind === 'neg' ? NEG : POS)[i])).join('<br>') + '</td><td class="muted">' + esc(r.comment || '') + '</td></tr>');
  const negRows = tableRows(negR, 'neg');
  const posRows = tableRows(posR, 'pos');
  const table = (title, cls, col, rows) => '<span class="pp-sec ' + cls + '">' + title + '</span><table class="pp-table"><thead><tr><th style="width:120px">Élève</th><th style="width:250px">' + col + '</th><th>Commentaire</th></tr></thead><tbody>' + (rows.length ? rows.join('') : '<tr><td colspan="3" class="muted">Aucun</td></tr>') + '</tbody></table>';
  // Découpe en pages : 12 lignes maximum par page.
  const all = negRows.map((r) => ['neg', r]).concat(posRows.map((r) => ['pos', r]));
  const chunks = [];
  for (let i = 0; i < Math.max(1, all.length); i += 12) chunks.push(all.slice(i, i + 12));
  const total = chunks.length;
  const pagesHTML = chunks.map((chunk, i) => {
    const n = chunk.filter((c) => c[0] === 'neg').map((c) => c[1]);
    const p = chunk.filter((c) => c[0] === 'pos').map((c) => c[1]);
    return '<div class="pp-body">' + head + (i === 0 ? stats : '') +
      (n.length || i === 0 ? table('Comportements à signaler', 'red', 'Comportements', n) : '') +
      (p.length || (i === total - 1 && !posR.length) ? table('Points positifs', 'green', 'Point positif', p) : '') +
      '<div style="flex:1"></div>' + (i === total - 1 ? pdfSign('Vu par le directeur') : '') + pdfFooter(i + 1, total) + '</div>';
  });
  await makePDF(pagesHTML, 'fiche-comportement-' + key + '.pdf', 'Fiche de suivi du comportement');
}

/* =========================================================
   Transfert d'élève et sauvegarde complète
   ========================================================= */
async function studentBundle(sid) {
  const [s, att, evs, notes, behav] = await Promise.all([dbGet('students', sid), dbAll('attendance'), dbAll('evaluations'), dbAll('notes'), dbAll('behaviour')]);
  return {
    type: 'pole-education-transfert', version: 1, exportedAt: Date.now(), student: s,
    attendance: att.filter((x) => x.marks[sid]).map((x) => ({ date: x.id, mark: x.marks[sid] })),
    evaluations: evs.filter((x) => x.sid === sid), notes: notes.filter((x) => x.sid === sid), behaviour: behav.filter((x) => x.sid === sid)
  };
}
async function importBundle(b) {
  const s = b.student;
  const exists = (await getStudents()).find((x) => norm(x.name) === norm(s.name));
  if (exists) throw new Error('Un élève nommé « ' + s.name + ' » existe déjà dans votre classe. Renommez-le (Élèves) puis recommencez.');
  if (await dbGet('students', s.id)) s.id = uid();
  const sid = s.id;
  await dbPut('students', Object.assign({}, s, { id: sid, receivedAt: Date.now() }));
  for (const a of b.attendance || []) { const ss = await getSession(a.date); ss.marks[sid] = a.mark; await saveSession(ss); }
  for (const e of b.evaluations || []) await dbPut('evaluations', Object.assign({}, e, { id: e.date + '|' + sid, sid }));
  for (const n of b.notes || []) await dbPut('notes', Object.assign({}, n, { id: uid(), sid }));
  for (const r of b.behaviour || []) await dbPut('behaviour', Object.assign({}, r, { id: r.date + '|' + sid, sid }));
  return s;
}
const STORES = ['kv', 'students', 'attendance', 'evaluations', 'notes', 'behaviour', 'trash', 'history'];
async function fullBackup() {
  const out = { type: 'pole-education-sauvegarde', version: 1, appVersion: APP_VERSION, exportedAt: Date.now(), data: {} };
  for (const st of STORES) {
    if (st === 'kv') {
      const keys = await run('kv', 'readonly', (s) => s.getAllKeys());
      const vals = await dbAll('kv');
      out.data.kv = keys.map((k, i) => [k, vals[i]]);
    } else out.data[st] = await dbAll(st);
  }
  return out;
}
async function restoreBackup(b) {
  for (const st of STORES) await run(st, 'readwrite', (s) => s.clear());
  for (const [k, v] of b.data.kv || []) await dbPut('kv', v, k);
  for (const st of STORES.filter((x) => x !== 'kv')) for (const row of b.data[st] || []) await dbPut(st, row);
}
function pickFile(accept) {
  return new Promise((resolve) => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = accept || '.json,application/json';
    inp.onchange = () => resolve(inp.files && inp.files[0]);
    inp.click();
  });
}
async function readJSON(file) {
  const text = await file.text();
  try { return JSON.parse(text); } catch (e) { throw new Error('Ce fichier n\u2019est pas lisible par Pôle Éducation.'); }
}

/* =========================================================
   Code PIN et guide de démarrage
   ========================================================= */
async function hashPin(pin) {
  const txt = 'pole-education:' + pin;
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
  }
  let h = 2166136261;
  for (let i = 0; i < txt.length; i++) { h ^= txt.charCodeAt(i); h = Math.imul(h, 16777619); }
  return 'f' + (h >>> 0).toString(16);
}
let pinEntry = '';
let pinMode = null; // 'unlock' | 'set1' | 'set2' | 'off'
let pinFirst = '';
let unlockResolve = null;
function renderPin(title, sub, error) {
  const dots = [0, 1, 2, 3].map((i) => '<span class="pin-dot' + (i < pinEntry.length ? ' on' : '') + '"></span>').join('');
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map((k) => k === '' ? '<span></span>' : '<button class="pin-key" data-action="pin-key" data-k="' + k + '" aria-label="' + (k === '⌫' ? 'Effacer' : k) + '">' + k + '</button>').join('');
  $('#pin-layer').innerHTML = '<div class="pin-screen"><div class="pin-box">' +
    '<span class="home-name" style="font-size:22px">' + esc(title) + '</span><span class="hint" style="text-align:center">' + sub + '</span>' +
    '<div class="pin-dots">' + dots + '</div><span class="error-text" style="min-height:20px;text-align:center">' + (error || '') + '</span>' +
    '<div class="pin-pad">' + keys + '</div>' +
    (pinMode !== 'unlock' ? '<button class="btn ghost full" data-action="pin-cancel">Annuler</button>' : '<span class="hint" style="text-align:center;font-size:12px">Code oublié ? Il faut réinstaller l\u2019application et restaurer une sauvegarde.</span>') +
    '</div></div>';
}
function askUnlock() {
  pinMode = 'unlock'; pinEntry = '';
  renderPin('Pôle Éducation', 'Entrez votre code à 4 chiffres');
  return new Promise((r) => { unlockResolve = r; });
}
async function pinComplete() {
  const code = pinEntry;
  pinEntry = '';
  if (pinMode === 'unlock') {
    if ((await hashPin(code)) === settings.pinHash) { $('#pin-layer').innerHTML = ''; const r = unlockResolve; unlockResolve = null; if (r) r(); }
    else renderPin('Pôle Éducation', 'Entrez votre code à 4 chiffres', 'Code incorrect, réessayez.');
  } else if (pinMode === 'set1') {
    pinFirst = code; pinMode = 'set2';
    renderPin('Confirmer le code', 'Tapez le même code une seconde fois');
  } else if (pinMode === 'set2') {
    if (code !== pinFirst) { pinMode = 'set1'; renderPin('Choisir un code', 'Choisissez un code à 4 chiffres', 'Les deux codes sont différents. Recommencez.'); return; }
    settings.pinHash = await hashPin(code);
    await saveSettings();
    await addHistory('Code PIN activé');
    $('#pin-layer').innerHTML = '';
    toast('Code PIN activé.');
    route(true);
  } else if (pinMode === 'off') {
    if ((await hashPin(code)) !== settings.pinHash) { renderPin('Désactiver le code', 'Entrez votre code actuel', 'Code incorrect.'); return; }
    delete settings.pinHash;
    await saveSettings();
    await addHistory('Code PIN désactivé');
    $('#pin-layer').innerHTML = '';
    toast('Code PIN désactivé.');
    route(true);
  }
}
